name: Fetch arXiv Papers

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Fetch papers and create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARXIV_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64） AppleWebKit/537.36"
        run: 
          uv sync;
          uv run python -m src.main --delay 2 --retry 3 --timeout 10

      - name: Upload paper diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-version-diffs
          path: diffs/
          if-no-files-found: ignore
          
