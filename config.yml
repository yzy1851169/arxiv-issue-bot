
# ============================================================
# arXiv Research Radar
# Focus: GPU Architecture + AI Infrastructure
# ============================================================

# ------------------------------------------------------------
# 1. arXiv categories
# ------------------------------------------------------------

categories:

  # Core: GPU architecture and performance
  - cs.AR
  - cs.PF

  # AI infrastructure and distributed systems
  - cs.DC
  - cs.OS
  - cs.NI

  # LLM models and AI methods
  - cs.LG
  - cs.CL
  - cs.AI

  # Compiler, data structures and storage systems
  - cs.PL
  - cs.DB
  - cs.DS
  - cs.CE

  # Emerging memory and device technologies
  - physics.app-ph


