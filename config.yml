# ------------------------------------------------------------
# 3. Fetching configuration
# ------------------------------------------------------------

# Number of newest papers fetched per category BEFORE keyword filtering
max_results_per_category: 200

# Issue labels
label_prefix: "arxiv"

# Include papers cross-listed in monitored categories
include_cross_listed: true
